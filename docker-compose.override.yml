services:
  db:
    ports:
      - "5432:5432"

  api:
    image: node:20-alpine
    working_dir: /workspace
    command: sh -c "corepack enable && pnpm install --frozen-lockfile=false && pnpm --filter @rrdd/api dev"
    volumes:
      - ./:/workspace
      - api_node_modules:/workspace/apps/api/node_modules
      - root_node_modules:/workspace/node_modules
    environment:
      NODE_ENV: development
      PORT: 4000
    depends_on:
      db:
        condition: service_healthy

  web:
    image: node:20-alpine
    working_dir: /workspace
    command: sh -c "corepack enable && pnpm install --frozen-lockfile=false && pnpm --filter @rrdd/web dev --host 0.0.0.0 --port 8081"
    volumes:
      - ./:/workspace
      - web_node_modules:/workspace/apps/web/node_modules
      - root_node_modules:/workspace/node_modules
    environment:
      VITE_API_URL: http://localhost:4000
    ports: !override
      - "8082:8081"
    depends_on:
      api:
        condition: service_healthy

volumes:
  root_node_modules:
  api_node_modules:
  web_node_modules:
